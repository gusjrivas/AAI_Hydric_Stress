name: aai-hydric-stress

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mlflow_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      (mc mb local/mlflow || true) &&
      exit 0
      "

  mlflow:
    build:
      context: ./docker/mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination s3://mlflow/
      --serve-artifacts
      --host 0.0.0.0
      --port 5000

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PRODUCER_V2_ENABLED: ${PRODUCER_V2_ENABLED:-false}
      PRODUCER_BUNDLE_ROOT: ${PRODUCER_BUNDLE_ROOT:-/workspace/data/operational_bundles}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Perfil opcional `demo` (HU6, openspec/changes/add-accelerated-sensor-demo/,
  # entrega 2): adaptador HTTP local de control de la demostración
  # acelerada de sensores. No se construye ni se levanta con
  # `docker compose up` normal; requiere `--profile demo` explícito y
  # una sesión ya preparada por CLI (ver scripts/demo_simulation/README.md).
  # No expone la preparación por HTTP ni reemplaza al backend operativo.
  demo-control:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/demo-control/Dockerfile
    restart: "no"
    depends_on:
      - backend
    environment:
      DEMO_CONTROL_ALLOWED_ORIGIN: ${DEMO_CONTROL_ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      # Enlazado a loopback del host: el servicio de control es local,
      # nunca se publica en todas las interfaces (ADR-0012).
      - "127.0.0.1:${DEMO_CONTROL_PORT:-8010}:8010"
    volumes:
      - ./demo_sessions:/workspace/demo_sessions
      # Necesario solo para `prepare` (invocado con `docker compose
      # --profile demo run --rm demo-control prepare ...`, que escribe
      # directamente el prefijo histórico al almacenamiento del backend,
      # ADR-0007). El comando por defecto de este servicio (`serve`) no
      # lee este volumen: accede al estado del backend únicamente por
      # HTTP (`GET /quality`, `GET /feedback`), nunca por lectura directa
      # de archivos. Sin este montaje, `prepare` escribía en un
      # `/workspace/data` efímero del contenedor, invisible para el
      # backend real (defecto encontrado y corregido en la entrega 4 de
      # verificación integrada).
      - ./data:/workspace/data
    # `DEMO_SESSION_ID` usa un valor por defecto vacío (no `:?`
    # obligatorio) para que interpolar este servicio nunca rompa
    # `docker compose` en el flujo normal (sin `--profile demo`): la
    # variable solo importa al levantar este servicio explícitamente,
    # y si falta, la propia CLI (`--id`) rechaza el valor vacío con un
    # motivo diagnosticable en vez de que compose falle en cualquier
    # invocación del proyecto.
    command:
      [
        "serve",
        "--host", "0.0.0.0",
        "--port", "8010",
        "--id", "${DEMO_SESSION_ID:-}",
        "--allowed-origin", "${DEMO_CONTROL_ALLOWED_ORIGIN:-http://localhost:5173}",
      ]

volumes:
  mlflow_postgres_data:
  mlflow_minio_data:
