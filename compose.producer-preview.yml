name: aai-producer-preview

services:
  prepare:
    image: ${PRODUCER_PREVIEW_BACKEND_IMAGE:-aai-producer-preview-backend:local}
    build:
      context: .
      dockerfile: docker/producer-preview/backend.Dockerfile
    command: ["python", "/workspace/preview/prepare.py"]
    environment:
      PRODUCER_V2_ENABLED: "true"
      PRODUCER_BUNDLE_ROOT: /workspace/data/operational_bundles
      MLFLOW_TRACKING_URI: file:///workspace/data/mlruns
    volumes:
      - preview_data:/workspace/data
    restart: "no"

  backend:
    image: ${PRODUCER_PREVIEW_BACKEND_IMAGE:-aai-producer-preview-backend:local}
    depends_on:
      prepare:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PRODUCER_V2_ENABLED: "true"
      PRODUCER_BUNDLE_ROOT: /workspace/data/operational_bundles
      MLFLOW_TRACKING_URI: file:///workspace/data/mlruns
    ports:
      - "127.0.0.1:${PRODUCER_PREVIEW_API_PORT:-8180}:8000"
    volumes:
      - preview_data:/workspace/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/sectors', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/producer-preview/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PRODUCER_PREVIEW_UI_PORT:-5180}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  preview_data:
