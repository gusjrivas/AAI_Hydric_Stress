[project]
name = "aai-hydric-stress"
version = "0.1.0"
description = "Prototipo experimental de arquitectura de IA para detección temprana de estrés hídrico (Trabajo Final, Maestría en IA, FIUBA)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "scikit-learn>=1.4",
    "mlflow>=2.14,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]
