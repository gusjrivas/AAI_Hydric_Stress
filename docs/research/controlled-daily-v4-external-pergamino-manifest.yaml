aggregation_rules:
  hourly_to_daily: >
    Promedio aritmético de las 24 observaciones horarias de cada día calendario,
    interpretado en America/Argentina/Buenos_Aires. No se imputan días con menos
    de 24 observaciones válidas (verificado: 100% de los 4018 días tienen
    exactamente 24 observaciones, en ambas fuentes, sin gaps).
  date_alignment: >
    Inner join por fecha calendario entre el promedio diario de ERA5-Land y el
    registro diario de NASA POWER (reconstruyendo la fecha desde YEAR+DOY).
    Aproximación metodológica: día civil UTC-3 y LST no son intervalos idénticos.
    No se convierte retrospectivamente LST a UTC a partir de agregados diarios.
    Consistencia reportada en auditoría histórica (no reabierta en esta intervención):
    4018/4018 fechas comunes, 0% de faltantes post-cruce, 0 fechas
    exclusivas de ninguna de las dos fuentes, en el rango 2015-01-01/2025-12-31.

experimental_design:
  target:
    rule: "stress(t) = 1 si soil_moisture(t+3) < P20_train"
    operator: strict_less_than
    horizon_days: 3
  primary_depth: soil_moisture_0_to_7cm
  sensitivity_depth: soil_moisture_7_to_28cm
  excluded_depths:
    - soil_moisture_28_to_100cm
    - soil_moisture_100_to_255cm
  periods:
    stage_a_development:
      target_timestamp_range: ["2015-01-10", "2022-12-31"]
      emission_range: ["2015-01-07", "2022-12-28"]
    stage_b_temporal_validation:
      target_timestamp_range: ["2023-01-04", "2023-12-31"]
      emission_range: ["2023-01-01", "2023-12-28"]
      status: executed_2026_09_21
      result: CANDIDATE_VALIDATED
    stage_c_holdout:
      target_timestamp_range: ["2024-01-04", "2025-12-31"]
      emission_range: ["2024-01-01", "2025-12-28"]
      status: opened_and_evaluated_2026_09_21
      opening_authorization: "Gustavo Rivas, responsable tecnico y cientifico del Trabajo Final (autorizacion explicita, 2026-09-21)"
      opening_date: "2026-09-21T04:06:11Z"
      opening_ledger: "holdout.sqlite, holdout_key 9bbd89a6a17ed3f670b6d7633605c60d27f887ff77c41d16d1867cc45b8138a1, estado CONFIRMADA, attempt_id 2121cdc901454df6be922c54a42d208d"
      opening_irreversible: true
      opening_condition: "CANDIDATE_VALIDATED en Etapa B (ver protocolo, sección 10)"
  nested_cv:
    outer: "TimeSeriesSplit(n_splits=3, gap=3)"
    inner: "TimeSeriesSplit(n_splits=3, gap=3)"
  models:
    - logistic_regression
    - random_forest
    - hist_gradient_boosting_classifier
    - soft_voting
  class_balancing: sample_weight (fold-local, w_c = n_train / (n_classes * n_train_c)); no class_weight
  decision_threshold: 0.5
  practical_margin_delta_mcc: 0.05
  bootstrap:
    method: moving_block_bootstrap
    block_days: 30
    replicas: 5000
    seed: 20250109

hyperparameter_grids:
  logistic_regression:
    C: [0.01, 0.1, 1.0, 10.0]
    weighting: [none, sample_weight_balanced]
